name: Full-stack CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ORIGIN: http://localhost:3000
  FASTAPI_INTERNAL_URL: http://127.0.0.1:8000

jobs:
  validate:
    name: Quality, PostgreSQL, and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: next_fastapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d next_fastapi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install backend dependencies
        run: cd backend && uv sync --locked --group dev

      - name: Run safe repository checks
        run: pnpm check
        env:
          DATABASE_URL: postgresql+psycopg://invalid:invalid@127.0.0.1:1/invalid
          DATABASE_MIGRATION_URL: postgresql+psycopg://invalid:invalid@127.0.0.1:1/invalid

      - name: Upgrade the integration database
        run: pnpm db:upgrade
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/next_fastapi_test
          DATABASE_MIGRATION_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/next_fastapi_test

      - name: Run PostgreSQL integration tests
        run: pnpm test:backend:integration
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/next_fastapi_test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/next_fastapi_e2e_test

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
